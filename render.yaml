# Hébergement du serveur de duels sur Render (https://render.com), offre gratuite.
# Sur Render : New > Blueprint, puis choisir ce dépôt. Voir le README.
services:
  - type: web
    name: sudokux-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /
