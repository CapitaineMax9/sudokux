# Compile l'APK Android du jeu et le publie dans l'onglet « Releases » du dépôt,
# sous le nom « Dernière version Android ». Se lance à chaque envoi de code
# sur les branches ci-dessous, ou à la main (onglet Actions → APK Android → Run workflow).
name: APK Android

on:
  push:
    branches:
      - main
      - claude/kind-goldberg-3u7but
  workflow_dispatch:

permissions:
  contents: write

# Si deux envois arrivent coup sur coup, on ne garde que la compilation la plus récente.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Configuration Firebase des duels par Internet (facultative), à renseigner dans
      # Settings → Secrets and variables → Actions → onglet « Variables ».
      EXPO_PUBLIC_FIREBASE_DATABASE_URL: ${{ vars.EXPO_PUBLIC_FIREBASE_DATABASE_URL }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Installer Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le jeu (tests)
        run: npm test -- --ci

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install

      - name: Compiler l'APK
        working-directory: android
        # Seulement les processeurs des vrais téléphones : la compilation va deux fois plus vite.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renommer l'APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk "sudokux-$VERSION.apk"
          echo "APK=sudokux-$VERSION.apk" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Garder l'APK dans les résultats de la compilation
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      - name: Publier dans « Releases »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk "$APK" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Dernière version Android ($VERSION)" \
            --notes "APK compilé automatiquement à partir du commit ${GITHUB_SHA::7} (branche ${GITHUB_REF_NAME}).

          Pour l'installer : ouvre cette page sur un téléphone Android, touche le fichier .apk, puis autorise l'installation d'applications inconnues quand Android le demande."
